name: XHello
version: 1.1.0
main: net.xdevstudios.xhello.XHello
api-version: "1.20"
author: XdevStudios
description: A tiny prototype plugin from XdevStudios, protected by LicenseX.
commands:
  xhello:
    description: Say hello (to yourself or another player).
    usage: /xhello [player]
  xflip:
    description: Flip a coin.
  xroll:
    description: Roll a die (6 sides unless you say otherwise).
    usage: /xroll [sides]
  xtime:
    description: Show the time in your world.
