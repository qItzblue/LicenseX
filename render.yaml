# Render Blueprint: New + -> Blueprint, pick this repo and the `deploy` branch.
# Builds Dockerfile.builder: LicenseX plus Java, Maven and Gradle, so the admin's Build page works.
# Don't need Build from source? Change dockerfilePath to ./Dockerfile (smaller, lighter).
# FREE plan: it sleeps after 15 min idle and its disk is wiped on every restart. Set up off-site backups (the
# LICENSEX_BACKUP_* values below, see docs/BACKUPS.md) and LicenseX restores itself after every wipe.
# Or switch `plan` to a paid one and uncomment the disk block so /data survives restarts.
services:
  - type: web
    name: licensex
    runtime: docker
    dockerfilePath: ./Dockerfile.builder
    dockerContext: .
    plan: free
    healthCheckPath: /api/public/site
    envVars:
      - key: LICENSEX_ADMIN_PASSWORD   # Render asks you for this when you create the service
        sync: false
      - key: LICENSEX_PUBLIC_URL       # e.g. https://licensex.onrender.com (the address Render gives you)
        sync: false
      # Off-site backups (docs/BACKUPS.md). Leave empty to skip; fill in under Environment later.
      - key: LICENSEX_BACKUP_S3_ENDPOINT     # e.g. https://s3.eu-central-003.backblazeb2.com
        sync: false
      - key: LICENSEX_BACKUP_S3_BUCKET
        sync: false
      - key: LICENSEX_BACKUP_S3_ACCESS_KEY
        sync: false
      - key: LICENSEX_BACKUP_S3_SECRET_KEY
        sync: false
      - key: LICENSEX_BACKUP_PASSWORD        # encrypts the copies; keep it safe
        sync: false
      - key: LICENSEX_BACKUP_DISCORD_WEBHOOK # optional: also post copies to a private Discord channel
        sync: false
    # disk:                            # paid plans only: keeps your licenses across restarts and deploys
    #   name: licensex-data
    #   mountPath: /data
    #   sizeGB: 1
