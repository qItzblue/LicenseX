<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LicenseX · Your plugin. Your buyers. No leaks.</title>
  <meta name="description" content="License keys for Minecraft plugins sold on BuiltByBit. Every download gets its own key and a hidden mark, so a leaked jar shows whose copy it was.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0a10">
  <link rel="stylesheet" href="/ds/styles.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/lx.css">
  <style>
    .hero-sec { position: relative; overflow: hidden; }
    .hero-sec::before { content: ''; position: absolute; right: -10%; top: 10%; width: 60%; height: 80%; background: radial-gradient(closest-side, rgba(229, 56, 59, .10), transparent); pointer-events: none; }
    .hero-sec .lx-hero { position: relative; padding-top: clamp(56px, 9vw, 112px); padding-bottom: clamp(72px, 10vw, 128px); }
    .hero-copy { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
    .hero-copy .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
    #result .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    #result .info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    #result .meta { font-size: 13px; color: var(--fg-2); }
    #result .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .result { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-1); display: flex; flex-direction: column; gap: 16px; }
    .slots { display: flex; flex-direction: column; gap: 8px; }
    .acct-hint { font-size: 14px; color: var(--fg-2); margin: 14px 0 0; }
    .steps { list-style: none; margin: 0; padding: 0; }
    .steps li { display: flex; }
    .steps .lx-card { display: flex; flex-direction: column; gap: 18px; width: 100%; }
    .steps .num { font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); }
    .steps h3 { font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
    .steps p { margin: 0; font-size: 14px; color: var(--fg-2); }
    .tracer-res { display: flex; flex-direction: column; gap: 20px; }
    .tracer-res h3 { font-size: 30px; font-weight: 650; letter-spacing: -.035em; line-height: 1.05; }
    .tracer-wait { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; min-height: 300px; }
    .devs { text-align: center; padding: clamp(32px, 6vw, 56px) 24px; }
    .devs .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  </style>
</head>
<body>
  <a class="lx-skip" href="#main">Skip to content</a>
  <div id="lxHeader"></div>
  <main id="main"><div class="lx-wrap muted" style="padding:80px var(--gutter)">Loading…</div></main>
  <div id="lxFooter"></div>
  <script type="module" src="/portal.js"></script>
</body>
</html>
