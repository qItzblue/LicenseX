<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LicenseX Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0b10">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="login" hidden>
    <div class="card login">
      <span class="brand"><span class="brand-mark">X</span>LicenseX</span>
      <p class="muted">Admin sign in</p>
      <div class="err" id="notAdmin" hidden></div>
      <div class="oauth" id="oauth" hidden></div>
      <div class="divider" id="or" hidden>or</div>
      <form id="loginForm">
        <div class="field"><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required></div>
        <div class="err" id="loginErr" hidden></div>
        <button class="btn primary" style="width:100%;justify-content:center">Sign in with password</button>
      </form>
      <a class="muted" href="/" style="display:block;text-align:center;margin-top:16px;font-size:14px">&larr; Back to the site</a>
    </div>
  </div>
  <div id="app" class="shell" hidden>
    <aside>
      <span class="brand"><span class="brand-mark">X</span>LicenseX</span>
      <nav id="nav"></nav>
      <div id="whoami" class="muted" style="margin-top:auto;font-size:13px;padding:0 4px"></div>
      <button class="btn ghost" id="logout">Sign out</button>
    </aside>
    <main id="view"></main>
  </div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
