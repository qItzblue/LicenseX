<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0b10">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/app.css">
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .box { width: min(420px, 100%); }
    .box.wide { width: min(760px, 100%); }
    .box .card { padding: 28px; }
    h1 { font-size: 24px; margin: 18px 0 6px; }
    .lead { margin: 0 0 18px; }
    .btn.block { width: 100%; justify-content: center; margin-bottom: 10px; }
    .divider + .btn.block, .card > .btn.block:last-child { margin-bottom: 0; }
    .err { color: var(--bad); font-size: 14px; background: rgba(248, 113, 113, .08); border: 1px solid rgba(248, 113, 113, .3); padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 14px; }
    .who { display: flex; align-items: center; gap: 12px; margin: 16px 0 18px; }
    .who img, .who .ph { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-weight: 700; color: var(--accent); object-fit: cover; }
    .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 11px; border-radius: 99px; margin-top: 18px; }
    .wide .head { text-align: center; margin-bottom: 4px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
    a.choice { display: flex; flex-direction: column; gap: 6px; padding: 24px; color: inherit; transition: .15s; }
    a.choice:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 14px 40px rgba(139, 92, 246, .15); }
    a.choice .ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 10px; }
    a.choice .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    a.choice h2 { font-size: 19px; }
    a.choice p { margin: 0; color: var(--muted); font-size: 14.5px; }
    a.choice .go { margin-top: auto; padding-top: 16px; color: var(--accent-2); font-weight: 600; font-size: 14px; }
    .alt { text-align: center; margin: 18px 0 0; font-size: 14px; color: var(--muted); }
    .back { display: block; text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
    @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } .box .card { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="box" id="box">
      <div id="view"><div class="card muted">Loading...</div></div>
      <a class="back" href="/">&larr; Back to the home page</a>
    </div>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
