<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My licenses</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/app.css">
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 28px 16px 80px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 44px; }
    nav.top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    nav.top a, nav.top button.linklike { font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 7px 12px; border-radius: 99px; transition: .15s; }
    nav.top a:hover, nav.top button.linklike:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
    nav.top a.pill { border: 1px solid var(--border-strong); color: var(--text); }
    nav.top a.pill:hover { border-color: var(--accent); background: var(--accent-soft); }
    nav.top a.admin { background: linear-gradient(135deg, var(--accent), #6d4de0); color: #fff; box-shadow: 0 6px 18px rgba(139, 92, 246, .35); }
    .intro h1 { font-size: clamp(28px, 5vw, 38px); font-weight: 800; letter-spacing: -.03em; }
    .intro p { color: var(--muted); margin: 8px 0 0; max-width: 560px; }

    form.add { margin: 26px 0 22px; padding: 18px; }
    form.add label { color: var(--text); font-weight: 600; font-size: 14px; }
    .addrow { display: flex; gap: 10px; flex-wrap: wrap; }
    .addrow input { flex: 1 1 240px; width: auto; min-width: 0; font-family: var(--mono); font-size: 15px; letter-spacing: .04em; }
    .msg { color: var(--bad); font-size: 14px; margin-top: 10px; }

    #list { display: grid; gap: 16px; }
    .lic { display: grid; gap: 16px; padding: 20px; }
    .lic.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { from { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); } }
    .lic-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .lic-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .lic-sub { color: var(--muted); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
    .keybox { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 8px 8px 12px; }
    .keybox code { font-size: 14px; letter-spacing: .03em; color: var(--muted); overflow-wrap: anywhere; }
    .usage { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
    .usage b { color: var(--text); }
    .track { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .track i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .track.full i { background: linear-gradient(90deg, var(--warn), var(--bad)); }
    .servers h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin-bottom: 4px; }
    .srv { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .srv:last-child { border-bottom: 0; padding-bottom: 0; }
    .srv .meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
    .none { color: var(--muted); font-size: 14px; padding: 8px 0 0; }
    .notice { font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
    .notice.bad { border-color: rgba(248, 113, 113, .4); background: rgba(248, 113, 113, .08); color: var(--bad); }
    .state { text-align: center; padding: 40px 20px; }
    .state .ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin: 0 auto 14px; }
    .state .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .state h2 { font-size: 20px; }
    .state p { color: var(--muted); max-width: 440px; margin: 8px auto 0; }
    .skel { height: 150px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border: 1px solid var(--border); }
    @keyframes shimmer { to { background-position: -200% 0; } }
    footer { margin-top: 48px; text-align: center; font-size: 14px; }
    footer a { color: var(--muted); } footer a:hover { color: var(--text); }
    @media (max-width: 560px) { header { margin-bottom: 30px; } nav.top .opt { display: none; } .lic { padding: 16px; } .addrow .btn { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="/"><span class="brand-mark" id="mark">X</span><span id="siteName">LicenseX</span></a>
    <nav class="top" id="authNav"></nav>
  </header>

  <section class="intro">
    <h1>My licenses</h1>
    <p id="sub">Every plugin license on your account, with the servers using it. Free up a slot whenever you move a server.</p>
  </section>

  <form class="card add" id="addForm" autocomplete="off">
    <label for="key">Add a license</label>
    <div class="addrow">
      <input id="key" placeholder="LX-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" autocomplete="off" aria-label="License key" required>
      <button class="btn primary" id="addBtn" type="submit">Add license</button>
    </div>
    <div class="hint">Paste the key from your server console. Licenses a developer issued to your email address appear here by themselves.</div>
    <div class="msg" id="addErr" role="alert" hidden></div>
  </form>

  <div id="list" aria-live="polite"><div class="skel"></div><div class="skel"></div></div>

  <footer><a href="/">&larr; Back to the home page</a></footer>
</main>
<script type="module" src="/account.js"></script>
</body>
</html>
